<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>Phone Atlas 前台性能基准</title><style>html,body{margin:0;background:#111716;color:#eee;font:13px sans-serif}iframe{position:fixed;inset:0;border:0;width:100%;height:100%}aside{position:fixed;top:5px;left:50%;transform:translateX(-50%);background:#18211fee;border:1px solid #66765a;border-radius:6px;padding:8px;display:flex;gap:8px;z-index:20;max-width:95%}button,select{background:#d6e9b9;color:#172018;border:0;border-radius:4px;padding:7px}pre{display:none}#status{max-width:280px;font-size:11px;align-self:center}</style><iframe id="app" src="../../?benchmark=1" title="性能基准产品"></iframe><aside><select id="context"><option value="foreground">前台（保持焦点、禁止截图）</option><option value="background">后台对照</option></select><button id="run">开始 90 秒</button><button id="save" disabled>下载 JSON/Trace</button><span id="status">静止30s / 旋转30s / 拆解30s</span></aside><pre id="result"></pre><script type="module">
 const frame=document.querySelector('#app'),status=document.querySelector('#status');let output;
 const delay=ms=>new Promise(r=>setTimeout(r,ms));
 document.querySelector('#run').onclick=async()=>{const api=frame.contentWindow.phoneAtlasBenchmark;if(!api){status.textContent='模型尚未完成初始化，请稍后重试';return;}const context=document.querySelector('#context').value;document.querySelector('#run').disabled=true;api.start(context);try{for(const phase of ['static','rotate','explode']){status.textContent=`${context} / ${phase} / 30 秒 · 勿截图`;api.phase(phase);await delay(30000);api.finishPhase();}output=api.stop();output.acceptance=output.phaseSummaries.map(p=>({phase:p.phase,validForeground:p.focusCoverage>.95&&p.visibleCoverage>.95,desktopTarget:p.p95FrameMs<=25&&p.fps>=59}));status.textContent='测量完成（按焦点覆盖率判断有效性）';document.querySelector('#result').textContent=JSON.stringify(output);document.querySelector('#save').disabled=false;}catch(e){status.textContent=e.message;}finally{document.querySelector('#run').disabled=false;}};
 document.querySelector('#save').onclick=()=>{for(const [name,data]of [['benchmark.json',output],['trace.json',{traceEvents:output.traceEvents}]]){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(data)],{type:'application/json'}));a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),2000);}};
</script></html>

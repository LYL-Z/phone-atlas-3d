<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>Phone Atlas 外观与资源验收台</title><style>html,body{margin:0;background:#111716;color:#eee;font:12px sans-serif}iframe{width:100%;height:100dvh;position:fixed;border:0}aside{position:fixed;z-index:5;top:4px;left:35%;display:flex;gap:5px;background:#18221f;padding:5px;border-radius:5px}button,select{padding:5px;background:#d2e7b2;border:0;border-radius:4px}pre{display:none}</style><iframe id="app" src="../?benchmark=1" title="外观验收产品"></iframe><aside><select id="view" aria-label="验收视角"><option value="back">背面</option><option value="front">正面</option><option value="side">侧面</option><option value="camera">镜头特写</option><option value="surface">背盖特写</option></select><select id="color" aria-label="验收配色"><option value="green">翡冷翠</option><option value="rose">玫瑰金</option><option value="white">晶钻白</option><option value="black">曜石黑</option></select><button id="capture">固定视角</button><button id="stress">20 次切色/切机</button><button id="checks">交互/画质检查</button><span id="status">就绪</span></aside><pre id="result"></pre><script type="module">
const frame=document.querySelector('#app'),$=id=>document.querySelector('#'+id),settle=()=>new Promise(r=>{let n=0;function f(){if(++n===4)r();else requestAnimationFrame(f);}requestAnimationFrame(f);});
$('capture').onclick=async()=>{const api=frame.contentWindow.phoneAtlasBenchmark;if(!api)return;$('status').textContent='渲染中';api.capture($('view').value,$('color').value);await settle();$('status').textContent='已渲染 '+$('view').value+' '+$('color').value;$('result').textContent=JSON.stringify(api.diagnostics());};
$('stress').onclick=async()=>{const api=frame.contentWindow.phoneAtlasBenchmark;if(!api)return;$('stress').disabled=true;const samples=[];for(let i=0;i<20;i++){api.capture('back',['green','rose','white','black'][i%4]);await settle();samples.push({kind:'color',i,...api.diagnostics().memory});}for(let i=0;i<20;i++){api.device(i%2?'huawei-mate90-collector':'atlas-generic-test');await settle();samples.push({kind:'device',i,...api.diagnostics().memory});}const tail=samples.filter(x=>x.kind==='color').slice(4);$('result').textContent=JSON.stringify({samples,colorTexturesStable:new Set(tail.map(x=>x.textures)).size===1,final:api.diagnostics()});$('status').textContent='资源回归完成';$('stress').disabled=false;};
$('checks').onclick=async()=>{const api=frame.contentWindow.phoneAtlasBenchmark,doc=frame.contentDocument,checks=[];const record=(name,pass,evidence)=>checks.push({name,status:pass?'PASS':'FAIL',evidence});
 const before=api.diagnostics().surfaceRoles;doc.querySelector('[data-select="back"]').click();await settle();const after=api.diagnostics().surfaceRoles;record('selection preserves other material opacity',before.filter(x=>x.part!=='back').every(x=>after.some(y=>y.part===x.part&&y.role===x.role&&y.opacity===x.opacity)),{selected:api.diagnostics().selected});
 doc.querySelector('#mode-xray').click();await settle();record('explicit xray',api.diagnostics().xray,true);doc.querySelector('#mode-xray').click();
 const original=doc.body.dataset.immersive;doc.querySelector('#immersive').click();record('immersive toggle',doc.body.dataset.immersive!==original,doc.body.dataset.immersive);doc.querySelector('#immersive').click();
 for(const q of ['low','medium','high']){api.quality(q);await settle();record('quality '+q,api.diagnostics().quality===q,{dpr:api.diagnostics().dpr,memory:api.diagnostics().memory});}api.quality('medium');
 for(const preset of ['studio','soft','rim','lowkey','room']){api.studio(preset);await settle();record('studio '+preset,api.diagnostics().studio===preset,api.diagnostics().memory);}api.studio('studio');
 for(let i=0;i<10;i++){doc.querySelectorAll('[data-view]')[i%5].click();await settle();}record('10 interrupted view changes',api.diagnostics().camera.position.every(Number.isFinite),api.diagnostics().camera);
 const screen=doc.querySelector('#screen-power');screen.checked=false;screen.dispatchEvent(new Event('change'));await settle();record('screen power control',api.diagnostics().screenEmission.every(x=>x===0),api.diagnostics().screenEmission);screen.checked=true;screen.dispatchEvent(new Event('change'));
 api.capture('back','green');await settle();$('result').textContent=JSON.stringify({checks,final:api.diagnostics()});$('status').textContent=checks.every(x=>x.status==='PASS')?'全部检查通过':'存在失败项';};
</script></html>
